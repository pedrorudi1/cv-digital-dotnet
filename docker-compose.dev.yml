version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-digital-dev
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000
    volumes:
      # Bind mount for hot reload during development
      - .:/app/src
    working_dir: /app/src
    develop:
      watch:
        - path: .
          action: rebuild
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge
